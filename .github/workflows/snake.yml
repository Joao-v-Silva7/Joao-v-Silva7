name: Generate Snake Animation

on:
  schedule:
    # Roda diariamente à meia-noite (UTC).
    - cron: "0 0 * * *" 
  workflow_dispatch:

# 🚨 BLOCO DE PERMISSÕES ADICIONADO PARA ESCREVER NO README 🚨
permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: platane/snk@v3
        with:

          github_user_name: Joao-v-Silva7
          # Garantindo que o output seja GIF para a animação
          outputs: |
            dist/github-snake.gif
            dist/github-snake-dark.gif?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Não é mais necessário subir artefato, a próxima etapa fará a injeção

      - uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            
            // 🚨 EXPRESSÃO REGULAR CORRIGIDA: SUBSTITUI SOMENTE O CONTEÚDO DENTRO DAS TAGS DE COBRA 🚨
            const newReadme = readme.replace(
              /[\s\S]*/, 
              '\n<p align="center">\n  <img src="https://raw.githubusercontent.com/${{ github.repository }}/output/github-snake.gif" alt="GitHub Snake" />\n</p>\n'
            );
            
            fs.writeFileSync('README.md', newReadme);
            
            // Faz o commit da alteração no README.md
            await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'README.md',
                message: 'Atualização: Injeção da animação GIF da cobrinha',
                content: Buffer.from(newReadme).toString('base64'),
                sha: (await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: 'README.md',
                })).data.sha
            });
