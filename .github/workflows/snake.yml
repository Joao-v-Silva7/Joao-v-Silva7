name: Generate Snake Animation

on:
  schedule:
    # Roda diariamente à meia-noite (UTC).
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: platane/snk@v3
        with:
          github_user_name: Joao-v-Silva7 
          # ALTERADO: Agora gera arquivos .gif
          outputs: |
            dist/github-snake.gif
            dist/github-snake-dark.gif?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8eabf2,#6082e6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: github-snake
          path: dist
      - uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            
            // ALTERADO: A URL de substituição agora usa .gif
            const newReadme = readme.replace(/[\s\S]*/, '\n<p align="center">\n  <img src="https://raw.githubusercontent.com/${{ github.repository }}/output/github-snake.gif" alt="GitHub Snake" />\n</p>\n');
            fs.writeFileSync('README.md', newReadme);
            
            await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'README.md',
                message: 'Atualização: Trocando para animação GIF da cobra',
                content: Buffer.from(newReadme).toString('base64'),
                sha: (await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: 'README.md',
                })).data.sha
            });
